<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <div class="auth-logo">&#x1F3CB;&#xFE0F;</div>
      <mat-card-title>FitTrack</mat-card-title>
      <mat-card-subtitle>Melde dich an</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="anmelden()" class="auth-form">
        <mat-form-field class="full-width">
          <mat-label>Benutzername</mat-label>
          <input matInput formControlName="username" autocomplete="username" autocapitalize="none" />
          @if (f.username.invalid && f.username.touched) {
            <mat-error>Mindestens 3 Zeichen</mat-error>
          }
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Passwort</mat-label>
          <input matInput formControlName="password" [type]="showPwd ? 'text' : 'password'" autocomplete="current-password" />
          <button mat-icon-button type="button" matSuffix (click)="showPwd = !showPwd">
            <mat-icon>{{ showPwd ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit" class="full-width submit-btn" [disabled]="form.invalid || isSubmitting">
          Anmelden
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <p class="auth-link">Noch kein Konto? <a routerLink="/register">Registrieren</a></p>
    </mat-card-actions>
  </mat-card>
</div>
